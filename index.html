<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MTE 2026 · Timeline (rover prototype)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F0E8;--ink:#0F1E3D;--mut:#4A5A78;--card:#F4F0E8;--grid:rgba(15,30,61,.07);--ph:#C9D3DE;--acc:#E8602C;--trail:#0F1E3D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1E3D;--ink:#F4F0E8;--mut:#A9B8D0;--card:#16294F;--grid:rgba(244,240,232,.07);--ph:#2C4373;--trail:#8FB8D8}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.d{font-family:Fraunces,Georgia,serif}
.m{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--ink);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 24px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
header.top nav{display:flex;gap:6px;flex-wrap:wrap}
header.top button{font:inherit;background:none;color:var(--ink);border:1px solid transparent;border-top:4px solid var(--mut);padding:10px 14px;min-height:44px;cursor:pointer}
header.top button.on{border-top-color:var(--acc)}
.hero{max-width:1152px;margin:0 auto;padding:64px 24px 24px}
.hero h1{font-size:clamp(44px,8vw,88px);line-height:1;margin:0 0 12px}
.hero p{max-width:520px;color:var(--mut);line-height:1.6;margin:0}
.wrap{position:relative;max-width:1152px;margin:0 auto;aspect-ratio:1152/2200;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px}
.wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.card{position:absolute;width:34.7%;background:var(--card);padding:12px;opacity:0;transform:translateY(16px);transition:opacity .5s .25s,transform .5s .25s}
.card.on{opacity:1;transform:none}
.cover{height:clamp(110px,15vw,190px);background:var(--ph);position:relative;display:flex;align-items:flex-end;padding:10px;clip-path:circle(0% at var(--ox) var(--oy));transition:clip-path .9s cubic-bezier(.2,.8,.2,1) .15s}
.card.on .cover{clip-path:circle(150% at var(--ox) var(--oy))}
.cover::after{content:"";position:absolute;inset:6px;border:1px dashed var(--mut)}
.card h3{font-size:clamp(18px,2.4vw,26px);margin:6px 0 4px;line-height:1.15}
.card p{margin:0;line-height:1.5;font-size:clamp(13px,1.4vw,16px)}
.card a{text-decoration:underline}
.node{fill:var(--bg);stroke:var(--ink);stroke-width:3;transition:fill .3s,r .3s}
.node.on{fill:var(--acc)}
.ring{fill:none;stroke:var(--acc);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.ring.on{animation:ping 1.2s ease-out 1}
@keyframes ping{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.end{max-width:1152px;margin:0 auto;padding:24px 24px 96px;color:var(--mut)}
.reduce .card,.reduce .cover{transition:none}
.reduce .card{opacity:1;transform:none}
.reduce .cover{clip-path:none}
.reduce .ring.on{animation:none}
@media (max-width:720px){.card{width:62%}}
</style>
</head>
<body>
<header class="top">
<span class="d" style="font-weight:700;font-size:20px">MTE 2026</span>
<nav class="m" id="nav" aria-label="Timeline milestones"></nav>
</header>
<section class="hero">
<div class="m" style="color:var(--mut)">Our timeline</div>
<h1 class="d">Drive through four years.</h1>
<p>Scroll and the rover follows the path. Each milestone opens its cover photo when the rover arrives.</p>
</section>

<main class="wrap" id="wrap">
<svg viewBox="0 0 1152 2200" aria-hidden="true">
<path id="base" d="M576 40 C576 140 240 120 240 300 S912 640 912 900 S240 1300 240 1560 S576 1900 576 2160" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round" opacity=".55"/>
<path id="trail" d="M576 40 C576 140 240 120 240 300 S912 640 912 900 S240 1300 240 1560 S576 1900 576 2160" fill="none" stroke="var(--trail)" stroke-width="4" stroke-linecap="round"/>
<g id="nodes"></g>
<g id="rover" transform="translate(576 40)">
<ellipse cx="0" cy="2" rx="30" ry="5" fill="#000" opacity=".15"/>
<rect x="-26" y="-30" width="52" height="20" rx="6" fill="#E8602C" stroke="#0F1E3D" stroke-width="2.5"/>
<rect x="-6" y="-46" width="20" height="14" rx="4" fill="#F4F0E8" stroke="#0F1E3D" stroke-width="2.5"/>
<circle cx="8" cy="-39" r="3.5" fill="#0F1E3D"/>
<path d="M-14 -30 V-52 M-14 -52 h-6" stroke="#0F1E3D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<g fill="#0F1E3D"><circle cx="-18" cy="-6" r="9"/><circle cx="18" cy="-6" r="9"/></g>
<g fill="#F4F0E8"><circle cx="-18" cy="-6" r="3"/><circle cx="18" cy="-6" r="3"/></g>
</g>
</svg>
</main>
<div class="end m">End of the path / more milestones appear only when confirmed</div>

<script>
(function(){
var items=[
 {x:240,y:300,cx:300,cy:210,t:"Industrial training and IT defense",meta:"Milestone 01 / [PERIOD]",txt:"Short memory or quote goes here.",ox:"0%",oy:"60%"},
 {x:912,y:900,cx:470,cy:810,t:"Field trips and shared experiences",meta:"Milestone 02 / [DATE]",txt:"Short memory or quote goes here.",ox:"100%",oy:"60%"},
 {x:240,y:1560,cx:300,cy:1470,t:"Final-year project defense week",meta:"Milestone 03 / [DATE]",txt:"Short memory or quote goes here.",ox:"0%",oy:"60%"}
];
var W=1152,H=2200,NS="http://www.w3.org/2000/svg";
var wrap=document.getElementById("wrap"),base=document.getElementById("base"),trail=document.getElementById("trail"),rover=document.getElementById("rover"),nodesG=document.getElementById("nodes"),nav=document.getElementById("nav");
var len=base.getTotalLength();
trail.style.strokeDasharray=len;trail.style.strokeDashoffset=len;
var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if(reduce)document.documentElement.classList.add("reduce");
items.forEach(function(it,i){
 var best=0,bd=1e9;
 for(var s=0;s<=len;s+=4){var p=base.getPointAtLength(s),d=Math.hypot(p.x-it.x,p.y-it.y);if(d<bd){bd=d;best=s}}
 it.len=best;
 var ring=document.createElementNS(NS,"circle");ring.setAttribute("class","ring");ring.setAttribute("cx",it.x);ring.setAttribute("cy",it.y);ring.setAttribute("r",16);
 var c=document.createElementNS(NS,"circle");c.setAttribute("class","node");c.setAttribute("cx",it.x);c.setAttribute("cy",it.y);c.setAttribute("r",16);
 nodesG.appendChild(ring);nodesG.appendChild(c);it.node=c;it.ring=ring;
 var card=document.createElement("article");card.className="card";
 card.style.left=(it.cx/W*100)+"%";card.style.top=(it.cy/H*100)+"%";
 card.innerHTML='<div class="cover" style="--ox:'+it.ox+';--oy:'+it.oy+'"><span class="m">Cover photo</span></div><div class="m" style="color:var(--mut);margin-top:10px">'+it.meta+'</div><h3 class="d">'+it.t+'</h3><p>'+it.txt+' <a href="#">Open gallery</a></p>';
 wrap.appendChild(card);it.card=card;
 var b=document.createElement("button");b.className="m";b.textContent="0"+(i+1)+" "+it.t.split(" and ")[0].split(" ").slice(0,2).join(" ");
 b.addEventListener("click",function(){
  var top=wrap.getBoundingClientRect().top+window.scrollY;
  window.scrollTo({top:top+it.len/len*wrap.offsetHeight-window.innerHeight*0.45+8,behavior:reduce?"auto":"smooth"});
 });
 nav.appendChild(b);it.btn=b;
});
var dir=1;
function update(){
 var r=wrap.getBoundingClientRect(),vh=window.innerHeight;
 var p=Math.min(1,Math.max(0,(vh*0.45-r.top)/r.height)),L=p*len;
 var pt=base.getPointAtLength(L),pt2=base.getPointAtLength(Math.min(len,L+4)),dx=pt2.x-pt.x;
 if(dx<-0.2)dir=-1;else if(dx>0.2)dir=1;
 rover.setAttribute("transform","translate("+pt.x+" "+pt.y+") scale("+dir+" 1)");
 trail.style.strokeDashoffset=len-L;
 var active=-1;
 items.forEach(function(it,i){
  var on=reduce||L>=it.len-12;
  if(on&&!it.card.classList.contains("on")){it.card.classList.add("on");it.node.classList.add("on");it.ring.classList.add("on")}
  if(!on&&!reduce){it.card.classList.remove("on");it.node.classList.remove("on");it.ring.classList.remove("on")}
  if(L>=it.len-12)active=i;
 });
 items.forEach(function(it,i){it.btn.classList.toggle("on",i===active)});
}
var tick=false;
window.addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(function(){update();tick=false})}},{passive:true});
window.addEventListener("resize",update);
update();
})();
</script>
</body>
</html>
